server {
    listen 80;
    server_name rt.smartdailyoptions.com;

    # Redirect HTTP to HTTPS
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name rt.smartdailyoptions.com;

    # SSL certificates (Let's Encrypt)
    # Run: sudo certbot --nginx -d rt.smartdailyoptions.com
    ssl_certificate /etc/letsencrypt/live/rt.smartdailyoptions.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rt.smartdailyoptions.com/privkey.pem;

    # SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Logging
    access_log /var/log/nginx/rt.smartdailyoptions.com.access.log;
    error_log /var/log/nginx/rt.smartdailyoptions.com.error.log;

    # Max request size
    client_max_body_size 1M;

    # Timeouts
    proxy_connect_timeout 5s;
    proxy_send_timeout 10s;
    proxy_read_timeout 10s;

    # Main routing
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # Pass original request info
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header User-Agent $http_user_agent;

        # Disable buffering for click redirects
        proxy_buffering off;
        proxy_redirect off;
    }

    # Health check endpoint (can be used by monitoring)
    location /health {
        proxy_pass http://127.0.0.1:3000/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    # Click endpoint (main traffic)
    location /click {
        proxy_pass http://127.0.0.1:3000/click;
        proxy_http_version 1.1;

        # Pass original request info
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header User-Agent $http_user_agent;

        # Disable buffering for redirects
        proxy_buffering off;
        proxy_redirect off;
    }
}
